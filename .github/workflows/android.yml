name: Android checks and APK
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # v3 defaults to 'tools platform-tools'; Google no longer serves 'tools'.
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - run: sh gradlew :guidance:test :app:lintDebug :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: dung-goc-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-and-lint-reports
          path: |
            guidance/build/reports/tests/
            app/build/reports/lint-results-debug.html
